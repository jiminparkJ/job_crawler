services:
  postgres:
    image: postgres:16-alpine
    container_name: jobhunter-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobhunter}
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jobhunter}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jobhunter:${POSTGRES_PASSWORD:-jobhunter}@postgres:5432/${POSTGRES_DB:-jobhunter}
      PORT: ${PORT:-3000}
    ports:
      - '${PORT:-3000}:3000'

volumes:
  postgres-data:
